<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>編み物計算</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf8f3;color:#4c443d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.75}
.wrap{max-width:700px;margin:auto;padding:20px 16px 45px}
h1{text-align:center;font-size:25px;margin:5px 0 8px}
.sub{text-align:right;color:#8b7d72;font-size:14px;margin-bottom:18px;padding-right:8px}
.card{background:#fff;border:1px solid #eadfd5;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #00000008}
.gauge{background:#f7eee9;border:2px solid #dfb8ad}
.title{font-size:20px;font-weight:800;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:14px;font-weight:700;display:block}
input{width:100%;font-size:18px;padding:12px;border:1px solid #d8ccc2;border-radius:10px;margin-top:5px;background:#fff;color:#4c443d}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#c98f87;color:#fff;font-size:17px;font-weight:800;margin-top:15px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.tab{margin:0;padding:11px 6px;background:#eee5df;color:#655950;font-size:14px}
.tab.active{background:#c98f87;color:#fff}
.tool{display:none} .tool.active{display:block}
.result-title{font-size:21px;font-weight:800}
.pattern{background:#faf5f1;border-radius:13px;padding:15px;margin-top:12px}
.pattern b{font-size:18px}
.headline{font-size:21px;font-weight:800}
.repeat{font-size:19px;font-weight:800;margin-top:10px}
.small{font-size:13px;color:#766b61}.warning{color:#d33;font-weight:800;font-size:17px}
.result b,.pattern b{font-weight:400}
#zr .headline,#zr .repeat,#zr b,#zr .small{font-size:inherit;font-weight:400}
.slope-numbers{font-size:18px;font-weight:800;letter-spacing:.18em;white-space:nowrap;overflow-x:auto;text-align:left;line-height:1.5;padding:8px 2px}
.brand{text-align:center;color:#8b7d72;letter-spacing:1px;margin-top:28px}
.counter-head{background:linear-gradient(135deg,#fff9f6,#f8ece7);border:2px solid #e5c4bb;position:relative;overflow:hidden}
.counter-head:after{content:"";position:absolute;right:14px;top:5px;font-size:48px;opacity:.12;transform:rotate(12deg)}
.counter-head .title{color:#7d5d56;margin-bottom:3px}
.counter-main{border:2px solid #ead7d0;background:#fffdfb;display:grid;grid-template-rows:100px 96px 54px 112px 38px;align-items:center}
.counter-current{text-align:center;color:#9a7e75;font-size:13px;font-weight:700;letter-spacing:.12em}
.counter-num{text-align:center;font-size:82px;font-weight:900;line-height:1.05;margin:0;color:#9d655d;text-shadow:0 2px 0 #f5e7e2}
.counter-num:after{content:" 段";font-size:20px;font-weight:700;color:#8b7d72;text-shadow:none}
.counter-action{background:#fff4f1;border:2px solid #dfb8ad;text-align:center;font-size:20px;font-weight:800;color:#76534d;border-radius:18px;padding:10px 12px;box-shadow:inset 0 0 0 4px #fff;height:86px;overflow:auto;display:flex;align-items:center;justify-content:center;line-height:1.45}
.counter-next{text-align:center;color:#766b61;margin:0;padding:8px 10px;background:#faf5f1;border-radius:12px;font-size:14px;min-height:42px;display:flex;align-items:center;justify-content:center}
.counter-buttons{display:flex;justify-content:center;gap:18px;margin-top:0}
.counter-buttons button{width:auto;min-width:76px;margin:0;padding:6px 13px;font-size:12px;background:#eee5df;color:#655950;border:1px solid #e0d3cb;border-radius:9px}
.counter-plus{justify-self:center;width:210px;height:88px;margin:0;font-size:28px;padding:0;border-radius:24px;background:#c98f87;box-shadow:0 5px 0 #ae746d;transition:.08s transform,.08s box-shadow}
.counter-plus:active{transform:translateY(3px);box-shadow:0 1px 0 #ae746d}
.counter-link{margin-top:8px;background:#b9837c}
.calc-import-mode{display:flex;gap:7px;justify-content:center;margin-top:10px}.calc-import-mode button{width:auto;margin:0;padding:7px 12px;font-size:12px;background:#eee5df;color:#655950;border:1px solid #e0d3cb;border-radius:10px}.calc-import-mode button.selected{background:#c98f87;color:#fff;border-color:#c98f87}
.counter-plan-card{background:#fffaf7;border:1px dashed #dfb8ad}
.counter-plan-title{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;color:#7d5d56;margin-bottom:8px}
#counterPlan>div{padding:7px 9px;border-bottom:1px dotted #e7d8d1;border-radius:8px}
#counterPlan>div:last-child{border-bottom:0}
#counterPlan>div[style*="font-weight:800"]{background:#fff0ec;color:#7d514b}
.counter-source-pill{display:inline-block;margin-top:5px;padding:4px 10px;border-radius:999px;background:#fff;color:#8b6d65;border:1px solid #ead7d0}
.counter-tip{text-align:center;font-size:12px;color:#9a887f;margin-top:12px}
.reset-row{display:flex;justify-content:flex-end;margin-top:8px}.reset-small{width:auto;margin:0;padding:6px 11px;font-size:12px;background:#eee5df;color:#655950;border:1px solid #e0d3cb;border-radius:9px}
.counter-setup{background:#fffaf7;border:1px solid #eadfd5}
.counter-setup .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.counter-setup input{font-size:16px;padding:10px}
.counter-quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.counter-quick button{width:auto;margin:0;padding:8px 11px;font-size:13px;background:#eee5df;color:#655950}
.counter-quick button.selected{background:#c98f87;color:#fff;border-color:#c98f87}
.counter-add{margin-top:10px;background:#b9837c}
.counter-end{display:flex;align-items:center;justify-content:center;gap:8px;background:#fffaf7;border:1px solid #eadfd5;padding:12px 14px}.counter-end label{margin:0;font-weight:700;color:#7b6a63}.counter-end input{width:82px;margin:0;padding:9px 8px;text-align:center;font-size:18px}.counter-end .unit{font-size:14px;color:#7b6a63;font-weight:700}
.counter-start{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:#7b6a63}
.counter-start span{font-weight:700;margin-right:2px}.counter-start button{width:auto;margin:0;padding:7px 10px;font-size:12px;background:#eee5df;color:#655950}.counter-start button.selected{background:#c98f87;color:#fff;border-color:#c98f87}.rule-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee2dc}.rule-row:last-child{border-bottom:0}.rule-actions{display:flex;gap:5px;flex-shrink:0}.rule-actions button{width:auto;margin:0;padding:4px 8px;font-size:11px;border-radius:8px;background:#eee5df;color:#655950}.rule-actions .delete{background:#f7ece8;color:#8a5e57}.editing-note{color:#9d655d;font-weight:700}
@media(max-width:520px){.counter-setup .grid3{grid-template-columns:repeat(3,1fr);gap:6px}.counter-setup .grid3 label{font-size:12px}.counter-setup .grid3 input{font-size:16px;padding:10px 7px}.counter-setup .action-field{grid-column:1/-1}}
@media(max-width:520px){.counter-num{font-size:76px}}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
 .tabs{grid-template-columns:1fr}
}
#slopeResult .pattern{font-size:18px;font-weight:800;line-height:1.7}
#slopeResult .pattern *{font-weight:800}

.rule-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee3dc}.rule-row:last-child{border-bottom:none}.rule-text{min-width:0;line-height:1.55;word-break:normal;overflow-wrap:anywhere}.rule-delete{width:auto!important;min-width:58px;flex:none;border:0;border-radius:14px;padding:6px 10px!important;margin:0!important;background:#f2e8e2;color:#8b5d56;font-size:13px!important;font-weight:700;white-space:nowrap}.rule-delete:active{transform:scale(.97)}
.counter-mode button{width:auto;padding:10px 18px;background:#eee5de;color:#66534d;border-radius:14px;font-weight:700}.counter-mode button.selected{background:#c98d84;color:#fff}.counter-mode span{color:#66534d}

.calc-start-row{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-size:14px;font-weight:700;flex-wrap:wrap}.calc-start-row input{width:78px!important;padding:9px 10px!important;font-size:16px!important;text-align:center}.calc-start-row .unit{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>編み物計算ツール</h1>
<div class="sub">bon epoux</div>

<div class="tabs">
 <button class="tab active" onclick="showTool('gaugeTool',this)">目数・段数</button>
 <button class="tab" onclick="showTool('zougenTool',this)">増し目・減らし目</button>
 <button class="tab" onclick="showTool('slopeTool',this)">斜線</button>
 <button class="tab" onclick="showTool('neckTool',this)">襟ぐり</button>
 <button class="tab" onclick="showTool('counterTool',this)">段数カウンター</button>
</div>

<section id="gaugeTool" class="tool active">
 <div class="card gauge">
  <div class="title"> ゲージ</div>
  <div class="grid">
   <div><label>10cmの目数<input id="gs" type="number" min="1" step="0.1" value="20"></label></div>
   <div><label>10cmの段数<input id="gr" type="number" min="1" step="0.1" value="26"></label></div>
  </div>
 </div>
 <div class="card">
  <div class="title">目数・段数の計算</div>
  <div class="grid">
   <div><label>幅（cm）<input id="gw" type="number" min="0" step="0.1" value="50"></label></div>
   <div><label>長さ（cm）<input id="gh" type="number" min="0" step="0.1" value="50"></label></div>
  </div>
  <button onclick="gaugeCalc()">計算する</button>
  <div class="reset-row"><button class="reset-small" onclick="resetTool('gauge')">リセット</button></div>
 </div>
 <div id="gaugeResult" class="card"></div>
</section>

<section id="zougenTool" class="tool">
 <div class="card">
  <div class="title">増し目・減らし目の計算</div>
  <label>今の目数<input id="za" type="number" value="100"></label>
  <label>仕上げたい目数<input id="zb" type="number" value="80"></label>
  <label>左右の端に残す目数（片側）<input id="ze" type="number" value="2"></label>
  <button onclick="zougenCalc()">計算する</button>
  <div class="reset-row"><button class="reset-small" onclick="resetTool('zougen')">リセット</button></div>
 </div>
 <div class="card" id="zr"></div>
</section>


<section id="slopeTool" class="tool">
 <div class="card">
  <div class="title">斜線の計算</div>
  <div class="grid">
   <div><label>段数<input id="slRows" type="number" min="1" step="1" value="18"></label></div>
   <div><label>目数<input id="slStitches" type="number" min="1" step="1" value="28"></label></div>
  </div>
  <div style="margin-top:12px">
   <label>用途</label>
   <label style="display:inline-block;margin-right:18px;font-weight:400">
    <input type="radio" name="slPurpose" value="shoulder" checked style="width:auto;margin-right:5px">肩下がり
   </label>
   <label style="display:inline-block;font-weight:400">
    <input type="radio" name="slPurpose" value="sleeve" style="width:auto;margin-right:5px">袖下・Vネック
   </label>
  </div>
  <button onclick="slopeCalc()">計算する</button>
  <div class="reset-row"><button class="reset-small" onclick="resetTool('slope')">リセット</button></div>
 </div>
 <div id="slopeResult" class="card"></div>
</section>

<section id="neckTool" class="tool">
 <div class="card">
  <div class="title">襟ぐりの計算</div>
  <div class="grid">
   <div><label>襟ぐりの幅（目）<input id="nw" type="number" min="1" step="1" value="40"></label></div>
   <div><label>前身頃の深さ（段）<input id="fd" type="number" min="1" step="1" value="28"></label></div>
   <div><label>後ろ身頃の深さ（段）<input id="bd" type="number" min="1" step="1" value="8"></label></div>
  </div>
  <button onclick="neckCalc()">計算する</button>
  <div class="reset-row"><button class="reset-small" onclick="resetTool('neck')">リセット</button></div>
 </div>
 <div id="front" class="card"></div>
 <div id="back" class="card"></div>
</section>

<section id="counterTool" class="tool">
 <div class="card counter-head">
  <div class="title"> 段数カウンター</div>
  <div id="counterSource" class="small counter-source-pill">必要な編み方を保存できます</div>
 </div>
 <div class="card counter-setup">
  <div class="title" style="font-size:17px">自分で予定を入れる</div>
  <div class="counter-quick" style="margin-top:4px">
   <button type="button" data-kind="increase" onclick="selectManualKind(this,'increase')">増し目</button>
   <button type="button" data-kind="decrease" onclick="selectManualKind(this,'decrease')">減らし目</button>
   <button type="button" data-kind="cross" onclick="selectManualKind(this,'cross')">交差</button>
   <button type="button" data-kind="other" onclick="selectManualKind(this,'other')">その他</button>
  </div>
  <div id="manualNumberFields" class="grid3" style="margin-top:10px">
   <div><label>何段ごと？<input id="manualGap" type="number" inputmode="numeric" enterkeyhint="next" min="1" step="1" placeholder="4"></label></div>
   <div><label>何目？<input id="manualStitches" type="number" inputmode="numeric" enterkeyhint="next" min="1" step="1" placeholder="1"></label></div>
   <div><label>何回？<input id="manualTimes" type="number" inputmode="numeric" enterkeyhint="done" min="1" step="1" placeholder="6"></label></div>
  </div>
  <div id="manualOtherFields" style="display:none;margin-top:10px">
   <div class="grid2">
    <div><label>何段？<input id="manualOtherRow" type="number" inputmode="numeric" enterkeyhint="next" min="1" step="1" placeholder="25"></label></div>
    <div><label>メモ<input id="manualMemo" type="text" enterkeyhint="done" maxlength="30" placeholder="例：印を付ける"></label></div>
   </div>
  </div>
  <div class="counter-mode" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px">
   <span style="font-weight:700">登録方法</span>
   <button type="button" class="selected" data-mode="add" onclick="selectManualMode(this,'add')">追加</button>
   <button type="button" data-mode="continue" onclick="selectManualMode(this,'continue')">続けて</button>
  </div>
  <div class="counter-start">
   <span>開始段</span>
   <button type="button" class="selected" data-start="1" onclick="selectManualStart(this,1)">1段目から</button>
   <button type="button" data-start="3" onclick="selectManualStart(this,3)">3段目から</button>
  </div>
  <button id="manualAddBtn" class="counter-add" onclick="addManualCounter()">予定を追加</button>
  <div id="manualMessage" class="small" style="margin-top:7px"></div>
 </div>
 <div class="card counter-end">
  <label for="counterStartRow">開始</label>
  <input id="counterStartRow" type="number" inputmode="numeric" min="1" step="1" value="1" onchange="setCounterStartRow()">
  <span class="unit">段目から</span>
  <label for="counterEndRow" style="margin-left:10px">終了</label>
  <input id="counterEndRow" type="number" inputmode="numeric" min="1" step="1" value="50" onchange="setCounterEndRow()">
  <span class="unit">段目まで</span>
 </div>
 <div class="card counter-main">
  <div id="counterNum" class="counter-num">0</div>
  <div id="counterAction" class="pattern counter-action">編み始め</div>
  <div id="counterNext" class="counter-next">次の予定をここに表示します</div>
  <button class="counter-plus" onclick="counterStep(1)">タップ</button>
  <div class="counter-buttons" style="margin-top:10px;gap:8px;flex-wrap:wrap">
   <button type="button" onclick="adjustFutureRows(-1)">1段削除</button>
   <button type="button" onclick="adjustFutureRows(1)">1段追加</button>
   <button type="button" id="counterUndoEdit" onclick="undoFutureRowEdit()" disabled>調整を戻す</button>
  </div>
  <div id="counterEditMessage" class="small" style="text-align:center;margin:5px 0 8px">現在の段より先の予定を調整します</div>
  <div class="counter-buttons">
   <button onclick="counterStep(-1)">戻る</button>
   <button onclick="counterReset()">リセット</button>
  </div>
  
 </div>
 <div class="card counter-plan-card">
  <div class="counter-plan-title">登録した予定</div>
  <div id="counterRulesList" class="small" style="margin-bottom:12px">まだ予定はありません。</div>
  <div class="counter-plan-title">このあとの予定</div>
  <div id="counterPlan" class="small">まだ予定はありません。</div>
 </div>
</section>

<div class="brand">bon epoux</div>
</div>

<script>
const $=id=>document.getElementById(id);
const r=x=>Math.max(1,Math.round(x));

function showTool(id,btn){
 // 項目を移動する前に、現在の入力・カウンター状態を必ず保存する。
 try{saveCounterState();saveFormState();}catch(e){}
 document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active'); btn.classList.add('active');
 if(id==='counterTool'){ try{loadCounterState();}catch(e){} renderCounter(); }
 try{localStorage.setItem('bonEpouxActiveTool',id);}catch(e){}
}

const FORM_STORAGE_KEY='bonEpouxFormStateV1';
const TOOL_DEFAULTS={
 gauge:{gs:'20',gr:'26',gw:'50',gh:'50'},
 zougen:{za:'100',zb:'80',ze:'2'},
 slope:{slRows:'18',slStitches:'28',slPurpose:'shoulder'},
 neck:{nw:'40',fd:'28',bd:'8'}
};
const FORM_IDS=['gs','gr','gw','gh','za','zb','ze','nw','fd','bd'];
let slopeModeValues={shoulder:{rows:'18',stitches:'28'},sleeve:{rows:'50',stitches:'12'}};
let currentSlopePurpose='shoulder';
function saveFormState(){
 try{
  const data={}; FORM_IDS.forEach(id=>{const el=$(id);if(el)data[id]=el.value;});
  const purpose=document.querySelector('input[name="slPurpose"]:checked'); data.slPurpose=purpose?purpose.value:'shoulder';
  data.slopeModeValues=slopeModeValues;
  localStorage.setItem(FORM_STORAGE_KEY,JSON.stringify(data));
 }catch(e){}
}
function loadFormState(){
 try{
  const raw=localStorage.getItem(FORM_STORAGE_KEY); if(!raw)return false;
  const data=JSON.parse(raw)||{};
  FORM_IDS.forEach(id=>{if(data[id]!==undefined&&$(id))$(id).value=data[id];});
  if(data.slopeModeValues&&data.slopeModeValues.shoulder&&data.slopeModeValues.sleeve){slopeModeValues=data.slopeModeValues;}
  if(data.slPurpose){const r=document.querySelector('input[name="slPurpose"][value="'+data.slPurpose+'"]');if(r)r.checked=true; currentSlopePurpose=data.slPurpose;}
  const sv=slopeModeValues[currentSlopePurpose]||slopeModeValues.shoulder; $('slRows').value=sv.rows; $('slStitches').value=sv.stitches;
  return true;
 }catch(e){return false}
}
function resetTool(kind){
 const d=TOOL_DEFAULTS[kind]; if(!d)return;
 Object.keys(d).forEach(k=>{
  if(k==='slPurpose'){const r=document.querySelector('input[name="slPurpose"][value="'+d[k]+'"]');if(r)r.checked=true;}
  else if($(k))$(k).value=d[k];
 });
 saveFormState();
 if(kind==='gauge')gaugeCalc();
 if(kind==='zougen')zougenCalc();
 if(kind==='slope'){ currentSlopePurpose='shoulder'; slopeModeValues={shoulder:{rows:'18',stitches:'28'},sleeve:{rows:'50',stitches:'12'}}; $('slRows').value='18'; $('slStitches').value='28'; slopeCalc(); saveFormState(); }
 if(kind==='neck')neckCalc();
}
function restoreActiveTool(){
 try{
  const id=localStorage.getItem('bonEpouxActiveTool'); if(!id||!$(id))return;
  const tab=[...document.querySelectorAll('.tab')].find(b=>b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+id+"'"));
  if(tab)showTool(id,tab);
 }catch(e){}
}
function gaugeCalc(){
 const gs=+$('gs').value, gr=+$('gr').value, w=+$('gw').value, h=+$('gh').value;
 if([gs,gr,w,h].some(x=>!isFinite(x)||x<0)||gs<=0||gr<=0){
  $('gaugeResult').innerHTML='<b>数字を正しく入力してください。</b>'; return;
 }
 const stitches=Math.round(w*gs/10);
 const rows=Math.round(h*gr/10);
 $('gaugeResult').innerHTML=`<div class="pattern" style="border:2px solid #dfb8ad;background:#fff7f4">
 <div class="small">${w}cm</div>
 <div style="font-size:25px;font-weight:800;margin-bottom:12px">${stitches}目</div>
 <div class="small">${h}cm</div>
 <div style="font-size:25px;font-weight:800">${rows}段</div>
 </div>`;
}

function gcd(a,b){while(b){let t=a%b;a=b;b=t}return a}
function zougenCalc(){
 let a=+document.getElementById("za").value,b=+document.getElementById("zb").value,e=+document.getElementById("ze").value,r=document.getElementById("zr");
 if(!Number.isInteger(a)||!Number.isInteger(b)||!Number.isInteger(e)||a<1||b<1||e<0){r.innerHTML="整数で入力してください。";return}
 if(a===b){r.innerHTML='<div class="headline">増し目・減らし目は必要ありません。</div>';return}
 let n=Math.abs(b-a), inc=b>a, usable=a-2*e;
 if(usable<=0){r.innerHTML="端に残す目数が多すぎます。";return}

 /* 増し目は、両端を除いた元の目数を超える回数は配置できない */
 if(inc && n>usable){
  r.innerHTML='<div class="warning">この目数では計算できません。<br>もう一度入力してください。</div>';
  return
 }
 if(!inc && n>=usable/2){
  r.innerHTML='<div class="warning">減らす目数が多すぎます。<br>もう一度入力してください。</div>';
  return
 }

 function formatPattern(vals){

  function bestRepeat(a){
   let best=null;
   for(let len=1;len<=Math.floor(a.length/2);len++){
    const block=a.slice(0,len); let reps=1;
    while((reps+1)*len<=a.length){
     let ok=true;
     for(let j=0;j<len;j++) if(a[reps*len+j]!==block[j]){ok=false;break;}
     if(!ok) break; reps++;
    }
    if(reps>=2){
     const covered=reps*len;
     if(!best || covered>best.covered || (covered===best.covered && len<best.len)) best={len,reps,covered,block};
    }
   }
   return best;
  }
  // 同じ内容が連続する部分は、どこにあっても必ず×○回にまとめる。
  function appendRuns(a){
   for(let i=0;i<a.length;){
    let j=i+1; while(j<a.length&&a[j]===a[i])j++;
    lines.push(`　${a[i]}段ごとに1目減らす${j-i>1?`×${j-i}回`:''}`);
    i=j;
   }
  }

  const rep=bestRepeat(dec); let lines=[];
  if(rep){
   if(rep.len===1){
    lines.push(`　${rep.block[0]}段ごとに1目減らす×${rep.reps}回`);

    rep.block.forEach((v,i)=>lines.push(`${i===0?'　◎':'　　'}${v}段ごとに1目減らす`));

   }
   // 繰り返し後に残った部分も、同じ行が続けば×○回にまとめる。
   appendRuns(dec.slice(rep.covered));
  }else{
   appendRuns(dec);
  }
  lines.push(`　${flat}段平`);

function allocate(total, weights){

 let order=raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
 for(let j=0;j<left;j++) vals[order[j%order.length][1]]++;

}

 // 右：2目以上は偶数段、1目は奇数段。左：すべて奇数段。
 // 最初の減らし目は伏せ目の翌段以降に配置する。
 let previous=1;
 for(const rule of rules){
  for(let i=0;i<rule.times;i++){
   let row=previous+(previous===1 && events.length===1 ? 1 : rule.gap);
   if(side==='right' && rule.amount>=2){if(row%2!==0)row++;}
   else {if(row%2===0)row++;}
   events.push({row,text:`${rule.amount}目減らす`});
   previous=row;
  }
 }
 return events;
}
function setNeckCounter(which,startInputId,totalRows,mode='new'){
 const data=neckCounterData[which]||[];
 if(!data.length){alert('先に襟ぐりを計算してください。');return;}
 const sideBox=document.querySelector('input[name="neckSide'+(which==='front'?'Front':'Back')+'"]:checked');
 const side=sideBox?sideBox.value:'left';
 const label=(which==='front'?'前身頃':'後ろ身頃')+'の襟ぐり（'+(side==='right'?'右用':'左用')+'）';
 const start=getCalcStartRow(startInputId);
 const events=neckEventsForSide(which,side);
 // 予定が指定の深さに収まらない場合は警告し、操作を黙って消さない。
 const last=Math.max(...events.map(e=>e.row));
 if(last>totalRows){alert('減らし目の予定が襟ぐりの深さ（'+totalRows+'段）を超えています。計算値を確認してください。');return;}
 applyCalculatedCounter(events,label,start,totalRows,mode);
}

// Insert/remove one row immediately AFTER the current row.
// Completed rows and the current-row instructions stay unchanged.
function adjustFutureRows(delta){
 const at=counterRow;
 if(delta===-1 && counterEndRow<=at+1){
  $('counterEditMessage').textContent='終了段が近いため、これ以上削除できません。';return;
 }
 // Store a snapshot so an accidental tap can be undone exactly.
 counterEditUndo.push(JSON.stringify({events:counterEvents,groups:counterCalcGroups,edits:counterRowEdits,end:counterEndRow,base:counterCalcBaseEvents}));
 if(counterEditUndo.length>15)counterEditUndo.shift();
 counterEvents=counterEvents.map(e=>({...e,row:e.row>at?Math.max(1,e.row+delta):e.row}));
 counterCalcGroups=counterCalcGroups.map(g=>({...g,end:g.end>at?Math.max(1,g.end+delta):g.end,start:g.start>at?Math.max(1,g.start+delta):g.start}));
 counterRowEdits.push({after:at,delta:delta,ruleIds:counterRules.map(r=>r.uid).filter(Boolean)});
 if(counterEndRow>at)counterEndRow=Math.max(at+1,counterEndRow+delta);
 $('counterEndRow').value=counterEndRow;
 $('counterEditMessage').textContent=(at+1)+'段目以降を1段'+(delta<0?'繰り上げ':'繰り下げ')+'ました。';
 saveCounterState();renderCounter();
}
function undoFutureRowEdit(){
 if(!counterEditUndo.length)return;
 const prev=JSON.parse(counterEditUndo.pop());
 counterEvents=prev.events;counterCalcGroups=prev.groups;counterRowEdits=prev.edits;
 counterEndRow=prev.end;counterCalcBaseEvents=prev.base;
 $('counterEndRow').value=counterEndRow;
 $('counterEditMessage').textContent='直前の段数調整を取り消しました。';
 saveCounterState();renderCounter();
}
function counterStep(n){
 counterRow=Math.max(0,counterRow+n);
 saveCounterState();
 renderCounter();
 // タップして進んだ段に操作予定があるときだけ、短く1回振動する。
 // Android等の対応ブラウザのみ動作。非対応端末では何もしない。
 if(n>0){
  try{
   const events=allCounterEvents(Math.max(counterRow+1,500));
   const hasAction=events.some(x=>x.row===counterRow);
   if(navigator.vibrate){
    if(counterEndRow && counterRow===counterEndRow) navigator.vibrate([180,100,180]);
    else if(hasAction) navigator.vibrate(120);
   }
  }catch(e){}
 }
}
function counterReset(){
 counterRow=0;
 counterEvents=[];
 counterCalcGroups=[];
 counterRules=[];
 counterLabel='';

 counterEndRow=50;
 counterCalcBaseEvents=[];

 counterEditUndo=[];

 if($('counterEndRow')) $('counterEndRow').value='50';
 try{localStorage.removeItem(COUNTER_STORAGE_KEY);}catch(e){}

}

function deleteCounterRule(index){
 if(index<0||index>=counterRules.length)return;
 counterRules.splice(index,1);
 if(!counterRules.length && !counterEvents.length){
  counterLabel='';

 }

}

function deleteCounterCalcGroup(id){
 counterEvents=counterEvents.filter(e=>e.groupId!==id);
 counterCalcGroups=counterCalcGroups.filter(g=>g.id!==id);
 // After removing a calculation, keep all other calculations and manual rules untouched.
 counterCalcBaseEvents=[];
 if(counterCalcGroups.length)counterEndRow=Math.max(...counterCalcGroups.map(g=>g.end||50));
 else if(!counterRules.length)counterEndRow=50;
 if($('counterEndRow'))$('counterEndRow').value=counterEndRow;
 counterLabel=counterCalcGroups.map(g=>g.label).join(' ＋ ')||(counterRules.length?'自分で入力した予定':'');
 if(!counterEvents.length&&!counterRules.length){
  $('counterSource').textContent='必要な編み方を保存できます';
 }else{

}
function escapeCounterHtml(v){
 return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Use a single listener on the list: regenerated buttons remain clickable.
document.getElementById('counterRulesList').addEventListener('click',function(event){
 const button=event.target.closest('button[data-delete-kind]');
 if(!button || !this.contains(button))return;
 event.preventDefault();
 event.stopPropagation();

 else if(button.dataset.deleteKind==='manual')deleteCounterRule(Number(button.dataset.deleteIndex));

function renderCounter(){
 const undo=$('counterUndoEdit');if(undo)undo.disabled=!counterEditUndo.length;
 $('counterNum').textContent=counterRow;
 const rulesList=$('counterRulesList');
 const calcRows=counterCalcGroups.map((g,i)=>{
  const info=g.start&&g.end?'（'+g.start+'〜'+g.end+'段目）':'';
  return '<div class="rule-row"><span class="rule-text">'+escapeCounterHtml(g.label+info)+'</span><button type="button" class="rule-delete" data-delete-kind="calc" data-delete-id="'+escapeCounterHtml(g.id)+'">削除</button></div>';
 });
 const manualRows=counterRules.map((rule,i)=>'<div class="rule-row"><span class="rule-text">'+escapeCounterHtml(ruleSummary(rule))+'</span><button type="button" class="rule-delete" data-delete-kind="manual" data-delete-index="'+i+'">削除</button></div>');
 rulesList.innerHTML=calcRows.concat(manualRows).join('')||'まだ予定はありません。';
 // 無期限の交差にも対応できるよう、現在位置より先までその都度予定を作る
 const horizon=Math.max(counterRow+500,500);
 const events=allCounterEvents(horizon).filter(x=>!counterEndRow || x.row<=counterEndRow);
 const now=events.filter(x=>x.row===counterRow);
 const nowTexts=now.map(x=>x.text);
 if(counterEndRow && counterRow===counterEndRow) nowTexts.push('ここまで！');
 $('counterAction').innerHTML=nowTexts.length?nowTexts.join('<br>'):(counterRow===0?'編み始め':'そのまま編む');
 const next=events.find(x=>x.row>counterRow);
 const nextEventRow=next?next.row:null;
 const nextEndRow=(counterEndRow&&counterEndRow>counterRow)?counterEndRow:null;
 if(nextEndRow && (!nextEventRow || nextEndRow<nextEventRow)){
  $('counterNext').innerHTML='次は <b>'+nextEndRow+'段目</b>：ここまで！';
 }else if(next){
  const same=events.filter(x=>x.row===next.row);
  const texts=[...new Set(same.map(x=>x.text))];
  if(counterEndRow===next.row) texts.push('ここまで！');
  $('counterNext').innerHTML='次は <b>'+next.row+'段目</b>：'+texts.join('・');
 }else if(nextEndRow){
  $('counterNext').innerHTML='次は <b>'+nextEndRow+'段目</b>：ここまで！';
 }else{
  $('counterNext').innerHTML=(counterEvents.length||counterRules.length)?'登録した予定は終了です。':'カウンターをセットしてください。';
 }
 const visible=events.filter(x=>x.row<=counterRow+120 && (!counterEndRow || x.row<=counterEndRow));
 const grouped=[];
 visible.forEach(x=>{
  let g=grouped.find(y=>y.row===x.row);
  if(!g){g={row:x.row,texts:[]};grouped.push(g);}
  if(!g.texts.includes(x.text))g.texts.push(x.text);
 });
 if(counterEndRow && counterEndRow<=counterRow+120){
  let g=grouped.find(y=>y.row===counterEndRow);
  if(!g){g={row:counterEndRow,texts:[]};grouped.push(g);}
  if(!g.texts.includes('ここまで！'))g.texts.push('ここまで！');
 }
 grouped.sort((a,b)=>a.row-b.row);
 if(grouped.length){
  $('counterPlan').innerHTML=grouped.map(g=>'<div style="'+(g.row<counterRow?'opacity:.45;':'')+(g.row===counterRow?'font-weight:800;':'')+'">'+g.row+'段目　'+g.texts.join('・')+(g.row===counterRow?'　← 今ここ':'')+'</div>').join('');
 }else{
  $('counterPlan').innerHTML='まだ予定はありません。';
 }
}

function neckCalc(){
 const total=+$('nw').value, frows=+$('fd').value, brows=+$('bd').value;
 if(!Number.isInteger(total)||!Number.isInteger(frows)||!Number.isInteger(brows)||total<1||frows<1||brows<1){
  $('front').innerHTML='<b>目数・段数は整数で入力してください。</b>';$('back').innerHTML='';return;
 }

 function parityCenter(total, ratio){
   const target=total*ratio;
   let n=Math.round(target);
   if((total-n)%2!==0){
     const lo=n-1, hi=n+1;
     if(lo<1)n=hi;
     else if(hi>total)n=lo;
     else n=Math.abs(lo-target)<=Math.abs(hi-target)?lo:hi;
   }
   return Math.max(1,Math.min(total,n));
 }

 // ---------- FRONT ----------
 // 中央は約50％伏せる。残りを左右同数にする。
 const fCenter=parityCenter(total,0.5);
 neckCounterBindOff.front=fCenter;
 const fSide=(total-fCenter)/2;

 // 減らし目は、深さのおよそ半分を目安に使う。
 // 形は「2段ごと大きく → 2目 → 1目 → 4段ごと1目」。
 // ただし必要目数・段数に応じて回数を自動調整する。
 let best=null;
 const targetCurve=frows/2;

 for(let big=1;big<=Math.max(1,fSide);big++){
  for(let mid=0;mid<=Math.min(6,fSide);mid++){
   for(let one=0;one<=Math.min(8,fSide);one++){
    for(let four=0;four<=Math.min(8,fSide);four++){
     if(big + 2*mid + one + four !== fSide) continue;
     const used=2 + 2*mid + 2*one + 4*four;
     if(used>frows) continue;

     // 基本形を優先：
     // 大きい減らし→2目減らし→1目減らし→4段ごと1目。
     // カーブ段数は全体の半分付近を優先する。
     let score=Math.abs(used-targetCurve)*8;
     if(mid===0) score+=8;
     if(one===0) score+=5;
     if(frows>=24 && four===0) score+=5;
     // 最初の大きい減らしは、片側目数の約1/3～2/5を目安。
     score+=Math.abs(big-fSide*0.38)*1.5;
     // 2目減らしは2回前後を好む。
     score+=Math.abs(mid-2)*1.2;
     // 同条件なら、平ら部分が半分に近いものを優先。
     const flat=frows-used;
     score+=Math.abs(flat-targetCurve)*2;

     if(!best || score<best.score) best={big,mid,one,four,used,score};
    }
   }
 }
 }

 // 万一組めない場合は、2段ごとの減らしだけで収める。
 if(!best){
   const big=Math.max(1,fSide);
   best={big,mid:0,one:0,four:0,used:2,score:0};
 }

 let frontLines=[];
 if(best.big>0) frontLines.push(`2段ごとに <b>${best.big}目減らす</b>`);
 if(best.mid>0) frontLines.push(`2段ごとに <b>2目減らす${best.mid>1?' ×'+best.mid+'回':''}</b>`);
 if(best.one>0) frontLines.push(`2段ごとに <b>1目減らす${best.one>1?' ×'+best.one+'回':''}</b>`);
 if(best.four>0) frontLines.push(`4段ごとに <b>1目減らす${best.four>1?' ×'+best.four+'回':''}</b>`);

 // カウンター用に、表示結果と同じ順番で減らし目ルールを保存
 neckCounterData.front=[];
 if(best.big>0) neckCounterData.front.push({gap:2,amount:best.big,times:1});
 if(best.mid>0) neckCounterData.front.push({gap:2,amount:2,times:best.mid});
 if(best.one>0) neckCounterData.front.push({gap:2,amount:1,times:best.one});
 if(best.four>0) neckCounterData.front.push({gap:4,amount:1,times:best.four});

 $('front').innerHTML=`<div class="result-title">前身頃</div>
 <div>襟ぐり幅：<b>${total}目</b>　深さ：<b>${frows}段</b></div>
 <div class="pattern"><b>${fCenter}目伏せる</b><br>
 ${frontLines.join('<br>')}<br>
 残りは <b>まっすぐ編む</b></div>
 <div class="neck-side-select" style="margin:12px 0 8px"><span style="font-weight:700;margin-right:10px">カウンター用</span><label style="display:inline-block;margin-right:16px"><input type="radio" name="neckSideFront" value="right"> 右用</label><label style="display:inline-block"><input type="radio" name="neckSideFront" value="left" checked> 左用</label></div>
 <div class="calc-start-row"><label for="neckStartFront">開始段</label><input id="neckStartFront" type="number" inputmode="numeric" min="1" step="1" value="1" onfocus="this.select()" onclick="this.select()"><span class="unit">段目から</span></div><div class="calc-import-mode" data-mode="new"><button class="selected" onclick="selectCalcImportMode(this,'new')">新しく</button><button onclick="selectCalcImportMode(this,'add')">追加</button></div><button class="counter-link" onclick="setNeckCounter('front','neckStartFront',${frows},getCalcImportMode(this))">この結果をカウンターで編む</button>`;

 // ---------- BACK ----------
 // 6段以下は従来どおり：約80％を伏せ、基本2回で減らす。
 // 6段を超える場合は約70％を伏せ、最後の1区間は平らに残し、
 // 2段ごとの減らし回数を段数から決める。
 let center, decs=[];

 if(brows<=6){
   center=parityCenter(total,0.8);
   const side=(total-center)/2;
   const maxOpsByRows=Math.max(1,Math.floor((brows-1)/2));
   const ops=Math.max(1,Math.min(side,2,maxOpsByRows));
   const q=Math.floor(side/ops), rem=side%ops;
   for(let i=0;i<ops;i++) decs.push(q+(i<rem?1:0));
 }else{
   center=parityCenter(total,0.7);
   const side=(total-center)/2;
   const chances=Math.max(1,Math.floor(brows/2)-1); // 最後の2段程度は平
   const ops=Math.max(1,Math.min(side,chances));

   // side目をops回に、大→小になるよう配分。
   // 各回最低1目。余りを前方ほど多めに配る。
   decs=Array(ops).fill(1);
   let left=side-ops;
   let i=0;
   while(left>0){
     const idx=Math.min(ops-1, Math.floor(i/2));
     decs[idx]++;
     left--; i++;
   }
   decs.sort((a,b)=>b-a);
 }

 const groups=[];
 for(const v of decs){
   const last=groups[groups.length-1];
   if(last && last.v===v) last.n++;
   else groups.push({v,n:1});
 }
 const backLines=groups.map(x=>`2段ごとに <b>${x.v}目減らす${x.n>1?' ×'+x.n+'回':''}</b>`).join("<br>");

 neckCounterBindOff.back=center;
 // 後ろ身頃も計算結果をそのままカウンターへ渡す
 neckCounterData.back=groups.map(x=>({gap:2,amount:x.v,times:x.n}));

 $('back').innerHTML=`<div class="result-title">後ろ身頃</div>
 <div>襟ぐり幅：<b>${total}目</b>　深さ：<b>${brows}段</b></div>
 <div class="pattern"><b>${center}目伏せる</b><br>
 ${backLines}<br>
 残りは <b>まっすぐ編む</b></div>
 <div class="neck-side-select" style="margin:12px 0 8px"><span style="font-weight:700;margin-right:10px">カウンター用</span><label style="display:inline-block;margin-right:16px"><input type="radio" name="neckSideBack" value="right"> 右用</label><label style="display:inline-block"><input type="radio" name="neckSideBack" value="left" checked> 左用</label></div>
 <div class="calc-start-row"><label for="neckStartBack">開始段</label><input id="neckStartBack" type="number" inputmode="numeric" min="1" step="1" value="1" onfocus="this.select()" onclick="this.select()"><span class="unit">段目から</span></div><div class="calc-import-mode" data-mode="new"><button class="selected" onclick="selectCalcImportMode(this,'new')">新しく</button><button onclick="selectCalcImportMode(this,'add')">追加</button></div><button class="counter-link" onclick="setNeckCounter('back','neckStartBack',${brows},getCalcImportMode(this))">この結果をカウンターで編む</button>`;
}
loadFormState();
// v24: 斜線の標準表示を肩下がり（18段・28目）へ変更。
// この版を初めて開いた時だけ旧版の選択状態を移行し、その後は通常どおり保存する。
try{
 const migrationKey='bonEpouxSlopeDefaultShoulderV24';
 if(!localStorage.getItem(migrationKey)){
   currentSlopePurpose='shoulder';
   slopeModeValues.shoulder={rows:'18',stitches:'28'};
   const shoulderRadio=document.querySelector('input[name="slPurpose"][value="shoulder"]');
   if(shoulderRadio) shoulderRadio.checked=true;
   $('slRows').value='18'; $('slStitches').value='28';
   localStorage.setItem(migrationKey,'1');
   saveFormState();
 }
}catch(e){}
gaugeCalc();
zougenCalc();
slopeCalc();
neckCalc();
// 保存済みのカウンターがあれば必ず復元。保存がなければ初期状態（0段・予定なし）。
// 画面移動や再表示では消さず、リセットを押した時だけ保存内容も消す。
try{ loadCounterState(); }catch(e){}
renderCounter();
restoreActiveTool();

// アプリを閉じる・別画面へ移る直前にも念のため保存する。
window.addEventListener('pagehide', function(){saveCounterState();saveFormState();});
// カウンターの状態は操作のたびに保存。ページを閉じても同じURLなら続きから再開。
window.addEventListener('beforeunload', function(){saveCounterState();saveFormState();});

document.addEventListener('visibilitychange', function(){
 if(document.visibilityState==='hidden'){saveCounterState();saveFormState();}
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  FORM_IDS.forEach(function(id){const el=$(id);if(el){el.addEventListener("input",saveFormState);el.addEventListener("change",saveFormState);}});
  ['slRows','slStitches'].forEach(function(id){const el=$(id);if(el){const keep=function(){slopeModeValues[currentSlopePurpose]={rows:$('slRows').value,stitches:$('slStitches').value};saveFormState();};el.addEventListener('input',keep);el.addEventListener('change',keep);}});
  document.querySelectorAll('input[name="slPurpose"]').forEach(function(radio){
    radio.addEventListener("change", function(){
      if(!this.checked) return;
      // 切替前の数値をその用途専用として保存し、切替先の数値を復元する。
      slopeModeValues[currentSlopePurpose]={rows:$('slRows').value,stitches:$('slStitches').value};
      currentSlopePurpose=this.value;
      const sv=slopeModeValues[currentSlopePurpose] || (currentSlopePurpose==='sleeve'?{rows:'50',stitches:'12'}:{rows:'18',stitches:'28'});
      $('slRows').value=sv.rows; $('slStitches').value=sv.stitches;
      saveFormState();
      slopeCalc();
    });
  });
  document.querySelectorAll('input[type="number"]').forEach(function(input){
    input.addEventListener("focus", function(){
      setTimeout(() => this.select(), 0);
    });
    input.addEventListener("click", function(){
      this.select();
    });
  });
  // スマホの「次へ／Enter」で次の入力欄へ進む
  const gap=document.getElementById('manualGap'), stitches=document.getElementById('manualStitches'), times=document.getElementById('manualTimes'), otherRow=document.getElementById('manualOtherRow'), memo=document.getElementById('manualMemo');
  function nextOnEnter(el, nextFn){
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); nextFn(); } });
  }
  nextOnEnter(gap, function(){
    if(manualKind==='cross'){ gap.blur(); }
    else if(manualKind==='increase'||manualKind==='decrease'){ stitches.focus(); }
  });
  nextOnEnter(stitches, function(){ if(!stitches.disabled) times.focus(); });
  nextOnEnter(times, function(){ times.blur(); });
  nextOnEnter(otherRow, function(){ memo.focus(); });
  nextOnEnter(memo, function(){ memo.blur(); });
});
</script>
